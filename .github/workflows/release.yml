name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/refocus.keystore"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/refocus.keystore" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Prepare release asset
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "Refocus-${VERSION}.apk"
          echo "APK_PATH=Refocus-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Verify release identity
        env:
          EXPECTED_CERT_SHA256: 711867c2ed3ece58719038c46a9d7dd37f974364dd430456bf82b204b8dc03c3
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"

          test -x "$APKSIGNER" || {
            echo "::error::apksigner was not found"
            exit 1
          }
          test -x "$AAPT2" || {
            echo "::error::aapt2 was not found"
            exit 1
          }

          if ! APK_CERTS="$(
            "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1
          )"; then
            echo "::error::APK signature verification failed"
            exit 1
          fi
          APK_CERT_SHA256="$(
            printf '%s\n' "$APK_CERTS" \
              | grep -Eio '[0-9a-f]{64}' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]' \
              || true
          )"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          APK_VERSION="$(
            "$AAPT2" dump badging "$APK_PATH" \
              | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" \
              | head -n 1
          )"

          test -n "$APK_CERT_SHA256" || {
            echo "::error::APK signing certificate could not be read"
            exit 1
          }
          test "$APK_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::APK signing certificate does not match the established release key"
            exit 1
          }
          test "$APK_VERSION" = "$EXPECTED_VERSION" || {
            echo "::error::APK version '$APK_VERSION' does not match '$EXPECTED_VERSION'"
            exit 1
          }

          echo "Verified APK version $APK_VERSION"
          echo "Verified signing certificate SHA-256 $APK_CERT_SHA256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Refocus $RELEASE_TAG" \
            --generate-notes
