name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/refocus.keystore"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/refocus.keystore" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Prepare release asset
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "Refocus-${VERSION}.apk"
          echo "APK_PATH=Refocus-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Refocus $RELEASE_TAG" \
            --generate-notes
